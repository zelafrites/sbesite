<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmity</title>
    <link rel="stylesheet" href="../..//css/style.css" type="text/css">
    <script src="../..//scripts/script.js" type="text/javascript" defer></script>
</head>
<body>
    <header>
            <a href="index.html"><img src="../..//res/images/logo.png" alt="Farmity Logo" class="logo"></a>
            <div>
                <input type="text" placeholder="Search...">
                <button>🔍</button>
            </div>
            <button class="menu-toggle" aria-label="Open menu" aria-expanded="false">
            ☰
            </button>
            <nav>
                <ul class="site-nav">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="products.html">Products</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
    </header>

    <form class="contact" action="mailto:contact@farmity.com" method="post">
        <h1>Contact Us</h1>
        <label>Email</label><br>
        <input type="email" placeholder="Email">
        <br>
        <label>Phone</label><br>
        <input type="number" placeholder="Phone">
        <br>
        <select>
            <option value="general">General Enquiry</option>
            <option value="payment">Problems with payment</option>
            <option value="delivery">Problems with delivery</option>
            <option value="product">Problems with product</option> 
        </select>
        <br>
        <textarea placeholder="Ask me anything . . ."></textarea>
        <br>
        <button>Submit</button>
    </form>
</body>
</html>
